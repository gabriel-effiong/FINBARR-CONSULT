<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finbarr Consult Admin</title>
    <style>
      :root {
        --primary: #0f172a;
        --primary-soft: #1d4ed8;
        --light: #f8fafc;
        --panel: #ffffff;
        --muted: #64748b;
        --border: #e2e8f0;
        --success: #16a34a;
        --warning: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eff6ff, #f8fafc);
        color: var(--primary);
      }

      .hidden {
        display: none !important;
      }

      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .auth-card {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        padding: 32px;
      }

      .auth-card h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      .auth-card p {
        margin: 0 0 24px;
        color: var(--muted);
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 1rem;
      }

      button {
        width: 100%;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary-soft), #2563eb);
        color: white;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      .delete-btn {
        width: auto;
        background: #dc2626;
        color: white;
        padding: 8px 12px;
        font-size: 0.8rem;
      }

      .error {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        display: none;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 1000;
      }

      .modal-backdrop.visible {
        display: flex;
      }

      .modal {
        width: min(420px, 100%);
        background: white;
        border-radius: 16px;
        border: 1px solid var(--border);
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.18);
        padding: 22px;
      }

      .modal h4 {
        margin: 0 0 10px;
        font-size: 1.3rem;
      }

      .modal p {
        margin: 0 0 20px;
        color: var(--muted);
      }

      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      .modal-actions button {
        width: auto;
        min-width: 110px;
      }

      .secondary-btn {
        background: #e2e8f0;
        color: var(--primary);
      }

      .topbar {
        background: var(--primary);
        color: white;
        padding: 20px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .topbar h2 {
        margin: 0;
      }

      .logout-btn {
        width: auto;
        background: rgba(255, 255, 255, 0.12);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 60px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 18px;
        margin-bottom: 28px;
      }

      .stat-card {
        background: white;
        border-radius: 14px;
        border: 1px solid var(--border);
        padding: 20px;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.03);
      }

      .stat-card .label {
        color: var(--muted);
        display: block;
        margin-bottom: 8px;
      }

      .stat-card .value {
        font-size: 2rem;
        font-weight: 700;
      }

      .panel {
        background: white;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 24px;
        overflow: hidden;
      }

      .panel h3 {
        margin-top: 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.96rem;
      }

      th,
      td {
        text-align: left;
        padding: 12px 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }

      th {
        background: #f8fafc;
        color: var(--muted);
      }

      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 0.72rem;
        font-weight: 700;
        background: #dbeafe;
        color: #1d4ed8;
      }

      .empty {
        color: var(--muted);
        padding: 20px 0;
      }

      @media (max-width: 640px) {
        .auth-card {
          padding: 22px;
        }
        .topbar {
          padding: 16px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div id="loginView" class="auth-shell">
      <div class="auth-card">
        <h1>Finbarr Consult</h1>
        <p>Admin dashboard</p>

        <div id="loginError" class="error">Invalid username or password.</div>

        <form id="loginForm">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" autocomplete="username" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit">Login</button>
        </form>
      </div>
    </div>

    <div id="dashboardView" class="hidden">
      <header class="topbar">
        <h2>Finbarr Admin Dashboard</h2>
        <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
      </header>

      <div id="deleteModal" class="modal-backdrop" aria-live="polite">
        <div
          class="modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="deleteModalTitle"
        >
          <h4 id="deleteModalTitle">Delete record?</h4>
          <p id="deleteModalText">This action cannot be undone.</p>
          <div class="modal-actions">
            <button id="cancelDeleteBtn" type="button" class="secondary-btn">
              Cancel
            </button>
            <button id="confirmDeleteBtn" type="button">Delete</button>
          </div>
        </div>
      </div>

      <div class="container">
        <div class="stats">
          <div class="stat-card">
            <span class="label">Total Contact Messages</span>
            <span id="contactCount" class="value">0</span>
          </div>
          <div class="stat-card">
            <span class="label">Total Consultations</span>
            <span id="consultationCount" class="value">0</span>
          </div>
          <div class="stat-card">
            <span class="label">Latest Submission</span>
            <span id="latestDate" class="value">--</span>
          </div>
        </div>

        <div class="panel">
          <h3>Recent Contact Messages</h3>
          <div id="contactTableContainer"></div>
        </div>

        <div class="panel">
          <h3>Consultation Requests</h3>
          <div id="consultationTableContainer"></div>
        </div>
      </div>
    </div>

    <script>
      const apiBaseUrl = (window.FINBARR_API_BASE_URL || "").replace(/\/$/, "");
      const loginView = document.getElementById("loginView");
      const dashboardView = document.getElementById("dashboardView");
      const loginForm = document.getElementById("loginForm");
      const loginError = document.getElementById("loginError");
      const logoutBtn = document.getElementById("logoutBtn");
      const contactTableContainer = document.getElementById(
        "contactTableContainer",
      );
      const consultationTableContainer = document.getElementById(
        "consultationTableContainer",
      );
      const contactCount = document.getElementById("contactCount");
      const consultationCount = document.getElementById("consultationCount");
      const latestDate = document.getElementById("latestDate");
      const deleteModal = document.getElementById("deleteModal");
      const deleteModalText = document.getElementById("deleteModalText");
      const confirmDeleteBtn = document.getElementById("confirmDeleteBtn");
      const cancelDeleteBtn = document.getElementById("cancelDeleteBtn");

      let pendingDelete = null;

      function getToken() {
        return sessionStorage.getItem("finbarr-admin-token");
      }

      function showDashboard() {
        loginView.classList.add("hidden");
        dashboardView.classList.remove("hidden");
      }

      function showLogin() {
        dashboardView.classList.add("hidden");
        loginView.classList.remove("hidden");
      }

      async function apiRequest(path, options = {}) {
        const headers = {
          "Content-Type": "application/json",
          ...(options.headers || {}),
        };
        const token = getToken();
        if (token) headers.Authorization = `Bearer ${token}`;

        const response = await fetch(`${apiBaseUrl}${path}`, {
          ...options,
          headers,
        });
        const responseText = await response.text();
        let data;
        if (responseText) {
          try {
            data = JSON.parse(responseText);
          } catch (error) {
            if (!(error instanceof SyntaxError)) throw error;
            throw new Error(
              `The API returned an invalid response (HTTP ${response.status}). Check that the API is deployed and FINBARR_API_BASE_URL points to it.`,
            );
          }
        }
        if (!data || typeof data !== "object" || Array.isArray(data)) {
          throw new Error(
            `The API returned an empty response (HTTP ${response.status}). Check that the API is deployed and FINBARR_API_BASE_URL points to it.`,
          );
        }
        if (!response.ok || !data.success) {
          if (response.status === 401)
            sessionStorage.removeItem("finbarr-admin-token");
          throw new Error(data.message || "The request failed.");
        }
        return data;
      }

      function openDeleteModal(record, deleteConfig) {
        pendingDelete = { record, deleteConfig };
        deleteModalText.textContent = `Delete this ${deleteConfig.label.toLowerCase()} record? This action cannot be undone.`;
        deleteModal.classList.add("visible");
      }

      function closeDeleteModal() {
        pendingDelete = null;
        deleteModal.classList.remove("visible");
      }

      function renderTable(container, rows, columns, deleteConfig) {
        if (!rows || rows.length === 0) {
          container.innerHTML = '<div class="empty">No records found.</div>';
          return;
        }

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const tbody = document.createElement("tbody");
        const headRow = document.createElement("tr");

        columns.forEach((col) => {
          const th = document.createElement("th");
          th.textContent = col.label;
          headRow.appendChild(th);
        });

        if (deleteConfig) {
          const th = document.createElement("th");
          th.textContent = "Action";
          headRow.appendChild(th);
        }

        thead.appendChild(headRow);
        table.appendChild(thead);

        rows.forEach((row) => {
          const tr = document.createElement("tr");
          columns.forEach((col) => {
            const td = document.createElement("td");
            let value = row[col.key];
            if (value === null || value === undefined || value === "")
              value = "-";
            if (col.format) value = col.format(value, row);
            td.textContent = value;
            tr.appendChild(td);
          });

          if (deleteConfig) {
            const td = document.createElement("td");
            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "delete-btn";
            deleteButton.textContent = "Delete";
            deleteButton.addEventListener("click", () => {
              openDeleteModal(row, deleteConfig);
            });
            td.appendChild(deleteButton);
            tr.appendChild(td);
          }

          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        container.replaceChildren(table);
      }

      async function loadData() {
        try {
          const [contactResult, consultationResult] = await Promise.all([
            apiRequest("/api/contact?limit=100"),
            apiRequest("/api/consultation?limit=100"),
          ]);
          const contacts = contactResult.contacts || [];
          const consultations = consultationResult.consultations || [];

          contactCount.textContent = String(
            contactResult.pagination?.total ?? contacts.length,
          );
          consultationCount.textContent = String(
            consultationResult.pagination?.total ?? consultations.length,
          );

          const newest = [...contacts, ...consultations]
            .filter((item) => item.createdAt)
            .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
          latestDate.textContent = newest?.createdAt
            ? new Date(newest.createdAt).toLocaleDateString()
            : "--";

          renderTable(
            contactTableContainer,
            contacts,
            [
              { key: "fullName", label: "Name" },
              { key: "email", label: "Email" },
              { key: "company", label: "Company" },
              { key: "service", label: "Service" },
              {
                key: "createdAt",
                label: "Date",
                format: (value) => new Date(value).toLocaleString(),
              },
            ],
            { path: "/api/contact", label: "Contact" },
          );
          renderTable(
            consultationTableContainer,
            consultations,
            [
              { key: "name", label: "Name" },
              { key: "email", label: "Email" },
              { key: "company", label: "Company" },
              { key: "service", label: "Service" },
              {
                key: "createdAt",
                label: "Date",
                format: (value) => new Date(value).toLocaleString(),
              },
            ],
            { path: "/api/consultation", label: "Consultation" },
          );
        } catch (error) {
          contactTableContainer.innerHTML =
            '<div class="empty">Unable to load submissions. Check the API connection and Neon database setup.</div>';
          consultationTableContainer.innerHTML =
            '<div class="empty">Unable to load submissions. Check the API connection and Neon database setup.</div>';
          console.error(error);
          if (!getToken()) showLogin();
        }
      }

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        loginError.style.display = "none";
        const submitButton = loginForm.querySelector("button[type='submit']");
        submitButton.disabled = true;

        try {
          const result = await apiRequest("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({
              username: document.getElementById("username").value.trim(),
              password: document.getElementById("password").value,
            }),
          });
          sessionStorage.setItem("finbarr-admin-token", result.token);
          showDashboard();
          await loadData();
        } catch (error) {
          loginError.textContent =
            error.message || "Invalid username or password.";
          loginError.style.display = "block";
        } finally {
          submitButton.disabled = false;
        }
      });

      cancelDeleteBtn.addEventListener("click", closeDeleteModal);
      deleteModal.addEventListener("click", (event) => {
        if (event.target === deleteModal) closeDeleteModal();
      });

      confirmDeleteBtn.addEventListener("click", async () => {
        if (!pendingDelete) return;
        const { record, deleteConfig } = pendingDelete;
        closeDeleteModal();

        try {
          await apiRequest(`${deleteConfig.path}/${record.id}`, {
            method: "DELETE",
          });
          await loadData();
        } catch (error) {
          alert(error.message || "Delete failed.");
        }
      });

      logoutBtn.addEventListener("click", function () {
        sessionStorage.removeItem("finbarr-admin-token");
        showLogin();
      });

      if (getToken()) {
        showDashboard();
        loadData();
      } else {
        showLogin();
      }
    </script>
  </body>
</html>
